{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Peapoll{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="topnav">
        <div class="topnav-inner">
            <a href="{% url 'home:home' %}" class="topnav-brand">Peapoll</a>
            <div class="topnav-links">
                <a href="{% url 'home:home' %}">Home</a>
                <a href="{% url 'polls:list' %}">Polls</a>
                {% if user.is_authenticated %}
                <a href="{% url 'polls:create' %}">New Poll</a>
                <a href="{% url 'polls:mine' %}">My Polls</a>
                <a href="{% url 'polls:votes' %}">My Votes</a>
                <a href="{% url 'accounts:profile' %}">Profile</a>
                <a href="{% url 'accounts:settings' %}">Settings</a>
                <a href="{% url 'accounts:logout' %}">Log Out</a>
                {% else %}
                <a href="{% url 'accounts:login' %}">Log In</a>
                <a href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="page-wrapper">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
